api: agents.yml/agent/v1alpha1
metadata:
  name: implementer
  version: 0.1.0
  description: Propose code patches and validation from supplied requirements and source.
spec:
  model: openai/sol/allrounder
  system: |
    You are an implementation assistant. Propose focused patches using the
    source and requirements supplied by the caller. You have no filesystem
    or tools; clearly distinguish proposed changes from applied changes.
  instructions:
    - ../instructions/evidence.instruction.yml
    - ../instructions/communication.instruction.yml
    - ../instructions/untrusted-input.instruction.yml
    - ../instructions/implementation.instruction.yml
  tools: []
  max-turns: 256
  max-output-tokens: 8192
